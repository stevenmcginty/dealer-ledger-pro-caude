<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Dealer Ledger Pro</title>
    <meta name="theme-color" content="#0B1117">
    <!-- Bump ?v= whenever manifest.json changes: Chrome's installed-app registry
         caches the manifest per-URL and survives cache-clears and reinstalls. -->
    <link rel="manifest" href="/manifest.json?v=5">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=4">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=4">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=4">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Atkinson Hyperlegible Next/Mono for the app; Inter for printed documents (font-paper). -->
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Set the light/dark theme before first paint so there is no flash.
      // Mirrors utils/themeMode.ts (same key, values and 'dark' default).
      (function () {
        var mode = 'dark';
        try { mode = localStorage.getItem('dlp.themeMode') || 'dark'; } catch (e) {}
        if (mode !== 'system' && mode !== 'light' && mode !== 'dark') mode = 'dark';
        var dark = mode === 'dark' || (mode === 'system' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#0B1117' : '#F1F3F5');
      })();
    </script>
    <style>
      @keyframes blink {
        50% { opacity: 0; }
      }
      .cursor-blink {
        animation: blink 1s step-end infinite;
      }
      .masonry-grid {
        column-gap: 1.5rem;
        column-count: 1;
      }
      @media (min-width: 768px) {
        .masonry-grid {
            column-count: 2;
        }
      }
      @media (min-width: 1024px) {
        .masonry-grid {
            column-count: 3;
        }
      }
      .break-inside-avoid {
        break-inside: avoid;
      }
      /* Keep browser autofill on the theme's input colours */
      input:-webkit-autofill,
      input:-webkit-autofill:hover, 
      input:-webkit-autofill:focus, 
      input:-webkit-autofill:active {
          -webkit-box-shadow: 0 0 0 30px rgb(var(--c-surface)) inset !important;
          -webkit-text-fill-color: rgb(var(--c-ink)) !important;
          border-radius: 0.5rem;
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: rgb(var(--c-surface-3)); 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgb(var(--c-line-strong));
      }
    </style>
</head>
  <body class="bg-bg text-ink font-sans antialiased" style="min-height: 100vh;">
    <div id="root"></div>
    <div id="pdf-renderer" class="hidden absolute top-[-10000px] left-0 font-paper"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Cloud Messaging has to be configured while the worker is being
          // evaluated, and public/sw.js is copied verbatim rather than bundled,
          // so it never sees import.meta.env. The config rides in on the
          // registration URL instead. Vite substitutes these three at build
          // time; if any is missing the %PLACEHOLDER% survives and the worker
          // registers exactly as it did before, without push.
          var fcm = ['%VITE_FIREBASE_API_KEY%', '%VITE_FIREBASE_MESSAGING_SENDER_ID%', '%VITE_FIREBASE_APP_ID%'];
          var swUrl = './sw.js';
          if (fcm.every(function (value) { return value && value.indexOf('%') === -1; })) {
            swUrl += '?fcmKey=' + encodeURIComponent(fcm[0])
              + '&fcmSender=' + encodeURIComponent(fcm[1])
              + '&fcmApp=' + encodeURIComponent(fcm[2]);
          }
          navigator.serviceWorker.register(swUrl, { updateViaCache: 'none' }).then(registration => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          }, err => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
