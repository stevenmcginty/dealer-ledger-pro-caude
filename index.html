  <body class="bg-gray-950 antialiased selection:bg-brand-500 selection:text-white" style="background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #020617 75%); min-height: 100vh;">
    <div id="root"></div>
    <div id="pdf-renderer" class="hidden absolute top-[-10000px] left-0"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Cloud Messaging has to be configured while the worker is being
          // evaluated, and public/sw.js is copied verbatim rather than bundled,
          // so it never sees import.meta.env. The config rides in on the
          // registration URL instead. Vite substitutes these three at build
          // time; if any is missing the %PLACEHOLDER% survives and the worker
          // registers exactly as it did before, without push.
          var fcm = ['%VITE_FIREBASE_API_KEY%', '%VITE_FIREBASE_MESSAGING_SENDER_ID%', '%VITE_FIREBASE_APP_ID%'];
          var swUrl = './sw.js';
          if (fcm.every(function (value) { return value && value.indexOf('%') === -1; })) {
            swUrl += '?fcmKey=' + encodeURIComponent(fcm[0])
              + '&fcmSender=' + encodeURIComponent(fcm[1])
              + '&fcmApp=' + encodeURIComponent(fcm[2]);
          }
          navigator.serviceWorker.register(swUrl, { updateViaCache: 'none' }).then(registration => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          }, err => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
