<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Dealer Ledger Pro</title>
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      @keyframes blink {
        50% { opacity: 0; }
      }
      .cursor-blink {
        animation: blink 1s step-end infinite;
      }
      :root, .theme-blue {
        /* Professional Navy/Royal Blue Theme */
        --color-brand-50: 240 249 255; --color-brand-100: 224 242 254; --color-brand-200: 186 230 253;
        --color-brand-300: 125 211 252; --color-brand-400: 56 189 248; --color-brand-500: 14 165 233;
        --color-brand-600: 2 132 199; --color-brand-700: 3 105 161; --color-brand-800: 7 89 133;
        --color-brand-900: 12 74 110; --color-brand-950: 8 47 73;
      }
      .theme-green {
        --color-brand-50: 240 253 244; --color-brand-100: 220 252 231; --color-brand-200: 187 247 208;
        --color-brand-300: 134 239 172; --color-brand-400: 74 222 128; --color-brand-500: 34 197 94;
        --color-brand-600: 22 163 74; --color-brand-700: 21 128 61; --color-brand-800: 22 101 52;
        --color-brand-900: 20 83 45; --color-brand-950: 5 46 22;
      }
      .theme-red {
        --color-brand-50: 254 242 242; --color-brand-100: 254 226 226; --color-brand-200: 254 202 202;
        --color-brand-300: 252 165 165; --color-brand-400: 248 113 113; --color-brand-500: 239 68 68;
        --color-brand-600: 220 38 38; --color-brand-700: 185 28 28; --color-brand-800: 153 27 27;
        --color-brand-900: 127 29 29; --color-brand-950: 68 8 8;
      }
      .theme-purple {
        --color-brand-50: 245 243 255; --color-brand-100: 237 233 254; --color-brand-200: 221 214 254;
        --color-brand-300: 196 181 253; --color-brand-400: 167 139 250; --color-brand-500: 139 92 246;
        --color-brand-600: 124 58 237; --color-brand-700: 109 40 217; --color-brand-800: 91 33 182;
        --color-brand-900: 76 29 149; --color-brand-950: 46 16 101;
      }
      .theme-pink {
          --color-brand-50: 253 242 248; --color-brand-100: 252 231 243; --color-brand-200: 251 207 232;
          --color-brand-300: 249 168 212; --color-brand-400: 244 114 182; --color-brand-500: 236 72 153;
          --color-brand-600: 219 39 119; --color-brand-700: 190 24 93; --color-brand-800: 157 23 77;
          --color-brand-900: 131 24 67; --color-brand-950: 74 4 34;
      }
      .theme-yellow {
          --color-brand-50: 254 252 232; --color-brand-100: 254 249 195; --color-brand-200: 254 240 138;
          --color-brand-300: 253 224 71; --color-brand-400: 250 204 21; --color-brand-500: 234 179 8;
          --color-brand-600: 202 138 4; --color-brand-700: 161 98 7; --color-brand-800: 133 77 14;
          --color-brand-900: 113 63 18; --color-brand-950: 66 32 6;
      }
      .masonry-grid {
        column-gap: 1.5rem;
        column-count: 1;
      }
      @media (min-width: 768px) {
        .masonry-grid {
            column-count: 2;
        }
      }
      @media (min-width: 1024px) {
        .masonry-grid {
            column-count: 3;
        }
      }
      .break-inside-avoid {
        break-inside: avoid;
      }
      /* Fix for browser autofill on dark theme */
      input:-webkit-autofill,
      input:-webkit-autofill:hover, 
      input:-webkit-autofill:focus, 
      input:-webkit-autofill:active {
          -webkit-box-shadow: 0 0 0 30px #1f2937 inset !important;
          -webkit-text-fill-color: #fff !important;
          border-radius: 0.5rem;
      }
      
      /* Glassmorphism Utilities */
      .glass-panel {
        background: rgba(31, 41, 55, 0.4);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      
      .glass-card {
        background: linear-gradient(145deg, rgba(31, 41, 55, 0.6) 0%, rgba(17, 24, 39, 0.8) 100%);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #374151; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #4b5563; 
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              'brand': {
                '50': 'rgb(var(--color-brand-50) / <alpha-value>)',
                '100': 'rgb(var(--color-brand-100) / <alpha-value>)',
                '200': 'rgb(var(--color-brand-200) / <alpha-value>)',
                '300': 'rgb(var(--color-brand-300) / <alpha-value>)',
                '400': 'rgb(var(--color-brand-400) / <alpha-value>)',
                '500': 'rgb(var(--color-brand-500) / <alpha-value>)',
                '600': 'rgb(var(--color-brand-600) / <alpha-value>)',
                '700': 'rgb(var(--color-brand-700) / <alpha-value>)',
                '800': 'rgb(var(--color-brand-800) / <alpha-value>)',
                '900': 'rgb(var(--color-brand-900) / <alpha-value>)',
                '950': 'rgb(var(--color-brand-950) / <alpha-value>)',
              },
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.1.1",
    "react-dom/client": "https://esm.sh/react-dom@^19.1.1/client",
    "react/": "https://esm.sh/react@^19.1.1/",
    "firebase/": "https://esm.sh/firebase@^12.1.0/",
    "@google/genai": "https://esm.sh/@google/genai",
    "papaparse": "https://esm.sh/papaparse@5.4.1",
    "jspdf": "https://esm.sh/jspdf@2.5.1",
    "html2canvas": "https://esm.sh/html2canvas@1.4.1",
    "jszip": "https://esm.sh/jszip@3.10.1",
    "react-dom/": "https://esm.sh/react-dom@^19.1.1/",
    "@heroicons/react/": "https://esm.sh/react@^2.2.0/",
    "react-dropzone": "https://esm.sh/react-dropzone@^14.3.8",
    "react-dom": "https://aistudiocdn.com/react-dom@^19.1.1"
  }
}
</script>
</head>
  <body class="bg-gray-950 antialiased selection:bg-brand-500 selection:text-white" style="background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #020617 75%); min-height: 100vh;">
    <div id="root"></div>
    <div id="pdf-renderer" class="hidden absolute top-[-10000px] left-0"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then(registration => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          }, err => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
